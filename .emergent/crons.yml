crons:
  - name: staff-summary
    description: "Emails the owners a Monday 9am Eastern summary of staff access changes from the past week"
    cron: "0 9 * * 1"
    timezone: "America/New_York"
    endpoint: "{{BASE_URL}}/api/cron/staff-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: staff-expiry
    description: "Daily 8am Eastern: warns 3 days before temporary staff access ends, then switches her to member"
    cron: "0 8 * * *"
    timezone: "America/New_York"
    endpoint: "{{BASE_URL}}/api/cron/staff-expiry"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: open-questions
    description: "Monday 9am Eastern: emails each staff member her unanswered sister questions"
    cron: "0 9 * * 1"
    timezone: "America/New_York"
    endpoint: "{{BASE_URL}}/api/cron/open-questions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
